<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #050505; --card: #111; --brd: #222; --acc: #00c896; 
            --red: #ff3b69; --txt: #fff; --dim: #888; --nav: #000;
        }
        .light-theme {
            --bg: #ffffff; --card: #f9f9f9; --brd: #e0e0e0; --acc: #00a37b; 
            --red: #d32f2f; --txt: #000; --dim: #666; --nav: #f0f0f0;
        }
        body { background: var(--bg); color: var(--txt); font-family: 'Roboto Mono', monospace; margin: 0; padding: 0; overflow: hidden; transition: 0.2s; font-size: 12px; }
        
        /* Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: var(--nav); display: flex; border-top: 1px solid var(--brd); z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; color: var(--dim); cursor: pointer; }
        .nav-item.active { color: var(--acc); }

        .page { display: none; height: calc(100vh - 65px); overflow-y: auto; width: 100%; }
        .page.active { display: block; }

        /* Order Book Style */
        .order-book { width: 80px; font-size: 9px; display: flex; flex-direction: column; border-right: 1px solid var(--brd); padding: 5px; }
        .ob-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
        .ob-ask { color: var(--red); } .ob-bid { color: var(--acc); }

        /* Trade UI */
        .trade-header { padding: 8px; border-bottom: 1px solid var(--brd); display: flex; justify-content: space-between; }
        .t-select, .t-input { background: #000; color: var(--txt); border: 1px solid var(--brd); padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; outline: none; }
        .trade-layout { display: flex; height: 100%; }
        .trade-form { flex: 1; padding: 10px; overflow-y: auto; }
        
        .side-tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .side-btn { flex: 1; padding: 10px; border-radius: 4px; text-align: center; cursor: pointer; border: 1px solid var(--brd); font-weight: bold; font-size: 10px; }
        .side-btn.active-long { background: var(--acc); color: #000; border-color: var(--acc); }
        .side-btn.active-short { background: var(--red); color: #fff; border-color: var(--red); }

        /* Position Block */
        .pos-block { background: var(--card); border: 1px solid var(--brd); padding: 12px; margin-top: 15px; border-radius: 6px; }
        .pnl { font-size: 16px; font-weight: bold; margin: 5px 0; }

        /* Home/Market */
        .market-item { padding: 15px; border-bottom: 1px solid var(--brd); display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body class="dark-theme">

    <div id="page-home" class="page active">
        <div style="padding:15px; border-bottom:1px solid var(--brd); display:flex; justify-content:space-between">
            <b>Market Hot 100</b>
            <span style="color:var(--dim); font-size:10px">Live WebSocket</span>
        </div>
        <div id="market-list"></div>
    </div>

    <div id="page-trade" class="page">
        <div class="trade-header">
            <select id="asset-picker" class="t-select" style="width:120px" onchange="changeAsset(this.value)"></select>
            <div id="price-now" style="font-weight:bold; color:var(--acc)">0.00</div>
        </div>
        
        <div id="tv_chart" style="height:180px; width:100%"></div>

        <div class="trade-layout">
            <div class="order-book" id="order-book-ui"></div>

            <div class="trade-form">
                <div class="side-tabs">
                    <div id="tab-long" class="side-btn active-long" onclick="setSide('LONG')">LONG</div>
                    <div id="tab-short" class="side-btn" onclick="setSide('SHORT')">SHORT</div>
                </div>

                <div style="margin-bottom:10px">
                    <label style="font-size:9px; color:var(--dim)">ORDER TYPE</label>
                    <select id="order-mode" class="t-select" onchange="toggleLimitUI()">
                        <option value="MARKET">Market Order</option>
                        <option value="LIMIT">Limit Order</option>
                    </select>
                </div>

                <div id="limit-box" style="display:none; margin-bottom:10px">
                    <label style="font-size:9px; color:var(--dim)">LIMIT PRICE</label>
                    <input type="number" id="limit-price" class="t-input" placeholder="0.00">
                </div>

                <div style="margin-bottom:10px">
                    <label style="font-size:9px; color:var(--dim)">AMOUNT (Bal: $<span class="user-bal">1000</span>)</label>
                    <input type="number" id="trade-amount" class="t-input" placeholder="0.00">
                </div>

                <div style="display:flex; gap:5px; margin-bottom:10px">
                    <div style="flex:1">
                        <label style="font-size:9px; color:var(--dim)">TP</label>
                        <input type="number" id="tp-price" class="t-input" placeholder="Take Profit">
                    </div>
                    <div style="flex:1">
                        <label style="font-size:9px; color:var(--dim)">SL</label>
                        <input type="number" id="sl-price" class="t-input" placeholder="Stop Loss">
                    </div>
                </div>

                <button id="main-exec-btn" onclick="executeTrade()" class="side-btn active-long" style="width:100%; border:none; padding:15px">OPEN POSITION</button>

                <div id="pos-ui" class="pos-block" style="display:none">
                    <div style="display:flex; justify-content:space-between; font-size:10px">
                        <span id="pos-info">BTC/USDT LONG</span>
                        <span id="pos-entry">Entry: 0</span>
                    </div>
                    <div id="pos-pnl" class="pnl">+0.00%</div>
                    <button onclick="closePos()" style="width:100%; background:var(--red); color:#fff; border:none; border-radius:4px; padding:5px">CLOSE</button>
                </div>
            </div>
        </div>
    </div>

    <div id="page-portfolio" class="page">
        <div id="wallet-not-connected" style="padding:100px 20px; text-align:center">
            <div id="ton-connect"></div>
            <p style="color:var(--dim); margin-top:20px">Please connect your wallet to see balance</p>
        </div>
        <div id="wallet-connected" style="display:none; padding:30px 20px; text-align:center">
            <p style="color:var(--dim)">Equity Balance</p>
            <h1 style="font-size:32px">$<span class="user-bal">1000.00</span></h1>
            <div style="background:var(--card); padding:15px; border-radius:10px; margin-top:20px; text-align:left">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px"><span>Asset</span><span>Balance</span></div>
                <div style="display:flex; justify-content:space-between"><b>USDT</b><b>1000.00</b></div>
            </div>
        </div>
    </div>

    <div id="page-settings" class="page">
        <div style="padding:15px; font-weight:bold; color:var(--acc)">Application Settings</div>
        <div class="market-item" onclick="toggleTheme()"><span>Theme Mode</span><b id="theme-name">Dark 🌙</b></div>
        <div class="market-item">
            <span>Language</span>
            <select class="t-select" style="width:100px">
                <option>English</option>
                <option>Русский</option>
                <option>Українська</option>
            </select>
        </div>
        <div class="market-item" style="color:var(--red)" onclick="tg.showAlert('Logged Out')"><span>Log Out</span><b>✕</b></div>
        <div class="market-item" onclick="tg.showAlert('Select Account...')"><span>Switch Account</span><b>⇄</b></div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="nav('page-home', this)">🏠<br>Home</div>
        <div class="nav-item" onclick="nav('page-trade', this)">📊<br>Trade</div>
        <div class="nav-item" onclick="nav('page-portfolio', this)">💼<br>Portfolio</div>
        <div class="nav-item" onclick="nav('page-settings', this)">⚙️<br>Settings</div>
    </nav>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        let balance = 1000.00, curPrice = 0, curSym = "BTCUSDT", tradeSide = "LONG", activePos = null;
        const assets = ["BTC","ETH","SOL","TON","XRP","DOGE","ADA","AVAX","DOT","MATIC","LINK","SHIB","LTC","NEAR","SUI","PEPE","TIA","ARB","OP","APT"];

        // Connect Wallet Logic
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://ton-connect.github.io/demo-dapp-with-react/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });
        tonConnectUI.onStatusChange(w => {
            document.getElementById('wallet-not-connected').style.display = w ? 'none' : 'block';
            document.getElementById('wallet-connected').style.display = w ? 'block' : 'none';
        });

        function nav(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active'); el.classList.add('active');
            if(id === 'page-trade') loadChart(curSym);
        }

        function toggleLimitUI() {
            document.getElementById('limit-box').style.display = (document.getElementById('order-mode').value === 'LIMIT') ? 'block' : 'none';
        }

        function setSide(s) {
            tradeSide = s;
            document.getElementById('tab-long').className = 'side-btn' + (s==='LONG'?' active-long':'');
            document.getElementById('tab-short').className = 'side-btn' + (s==='SHORT'?' active-short':'');
            document.getElementById('main-exec-btn').className = 'side-btn' + (s==='LONG'?' active-long':' active-short');
        }

        function executeTrade() {
            const amt = parseFloat(document.getElementById('trade-amount').value) || 0;
            const price = (document.getElementById('order-mode').value === 'MARKET') ? curPrice : parseFloat(document.getElementById('limit-price').value);

            if(amt > balance) return tg.showAlert("INSUFFICIENT FUNDS");
            if(amt <= 0) return tg.showAlert("Invalid amount");

            activePos = {
                sym: curSym, entry: price, side: tradeSide, size: amt,
                tp: parseFloat(document.getElementById('tp-price').value) || null,
                sl: parseFloat(document.getElementById('sl-price').value) || null
            };

            balance -= amt;
            updateUI();
            document.getElementById('pos-ui').style.display = 'block';
            document.getElementById('pos-info').innerText = `${curSym} ${tradeSide}`;
            document.getElementById('pos-entry').innerText = `Entry: ${price}`;
        }

        function closePos() {
            balance += activePos.size; // Демо: возвращаем тело депозита
            activePos = null;
            updateUI();
            document.getElementById('pos-ui').style.display = 'none';
        }

        function updateUI() {
            document.querySelectorAll('.user-bal').forEach(el => el.innerText = balance.toFixed(2));
        }

        function loadChart(s) {
            new TradingView.widget({
                "autosize": true, "symbol": "BINANCE:" + s, "interval": "1", "theme": "dark", "container_id": "tv_chart", "hide_top_toolbar": true, "backgroundColor": "#050505"
            });
        }

        function toggleTheme() {
            const b = document.body;
            b.className = b.className === 'dark-theme' ? 'light-theme' : 'dark-theme';
            document.getElementById('theme-name').innerText = b.className === 'dark-theme' ? 'Dark 🌙' : 'Light ☀️';
        }

        function changeAsset(a) { curSym = a + "USDT"; loadChart(curSym); }

        function init() {
            const list = document.getElementById('market-list');
            const pick = document.getElementById('asset-picker');
            assets.forEach(a => {
                const item = document.createElement('div');
                item.className = 'market-item';
                item.innerHTML = `<b>${a}/USDT</b><span id="m-${a}">---</span>`;
                item.onclick = () => { curSym = a + "USDT"; nav('page-trade', document.querySelectorAll('.nav-item')[1]); };
                list.appendChild(item);

                const opt = document.createElement('option');
                opt.value = a; opt.innerText = a + "/USDT";
                pick.appendChild(opt);
            });

            // WebSocket
            const ws = new WebSocket('wss://stream.binance.com:9443/ws');
            ws.onopen = () => ws.send(JSON.stringify({method:"SUBSCRIBE", params: assets.map(a => a.toLowerCase()+"usdt@ticker"), id:1}));
            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if(!d.s) return;
                const p = parseFloat(d.c).toFixed(2);
                const s = d.s.replace('USDT','');
                if(document.getElementById(`m-${s}`)) document.getElementById(`m-${s}`).innerText = p;

                if(d.s === curSym) {
                    curPrice = p;
                    document.getElementById('price-now').innerText = p;
                    renderOB(p);
                    if(activePos) {
                        const diff = activePos.side === 'LONG' ? (p - activePos.entry) : (activePos.entry - p);
                        const pnlVal = ((diff / activePos.entry) * 100).toFixed(2);
                        const ui = document.getElementById('pos-pnl');
                        ui.innerText = (pnlVal >= 0 ? '+' : '') + pnlVal + "%";
                        ui.style.color = pnlVal >= 0 ? 'var(--acc)' : 'var(--red)';
                        
                        // TP/SL Logic
                        if(activePos.tp && ((activePos.side === 'LONG' && p >= activePos.tp) || (activePos.side === 'SHORT' && p <= activePos.tp))) closePos();
                        if(activePos.sl && ((activePos.side === 'LONG' && p <= activePos.sl) || (activePos.side === 'SHORT' && p >= activePos.sl))) closePos();
                    }
                }
            };
        }

        function renderOB(price) {
            const container = document.getElementById('order-book-ui');
            let html = '';
            for(let i=0; i<5; i++) html += `<div class="ob-row ob-ask"><span>${(price * 1.001).toFixed(2)}</span><span>${(Math.random()*2).toFixed(1)}</span></div>`;
            html += `<div style="text-align:center; padding:5px 0; border-y: 1px solid #333">${price}</div>`;
            for(let i=0; i<5; i++) html += `<div class="ob-row ob-bid"><span>${(price * 0.999).toFixed(2)}</span><span>${(Math.random()*2).toFixed(1)}</span></div>`;
            container.innerHTML = html;
        }

        init();
        updateUI();
    </script>
</body>
</html>
