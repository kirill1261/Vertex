<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b0b;
            --card-bg: #141414;
            --border: #262626;
            --accent: #00ffa3; /* Зеленый Hyperliquid */
            --text-main: #e5e5e5;
            --text-dim: #808080;
            --red: #ff3b69;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Roboto Mono', monospace;
            margin: 0;
            padding: 0;
            font-size: 13px;
            user-select: none;
            overflow: hidden; /* Фиксируем экран */
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-weight: 700; color: var(--accent); letter-spacing: -1px; }

        /* Вкладки контента */
        .page { display: none; height: calc(100vh - 120px); animation: fadeIn 0.2s ease; overflow-y: auto; }
        .page.active { display: block; }

        /* Элементы Trade (График) */
        #tradingview_widget {
            width: 100%;
            height: 60%; /* График занимает 60% экрана */
            border-bottom: 1px solid var(--border);
        }

        .trade-controls {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .price-up { color: var(--accent); }
        .price-down { color: var(--red); }

        /* Portfolio Styles */
        .stat-label { color: var(--text-dim); font-size: 11px; margin-bottom: 4px; padding: 16px 16px 0 16px;}
        .stat-value { font-size: 18px; font-weight: bold; margin-bottom: 15px; padding: 0 16px;}
        .portfolio-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 4px;
            margin: 16px;
        }

        /* Кнопки в стиле HL */
        .hl-btn {
            width: 100%;
            background: var(--accent);
            color: black;
            border: none;
            padding: 12px;
            font-family: 'Roboto Mono', monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 2px;
        }

        .hl-btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        /* Bottom Nav */
        .nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 10px;
            transition: 0.2s;
            cursor: pointer;
        }

        .nav-item.active { color: var(--accent); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">VERTEX_HL</div>
        <div id="ton-connect"></div>
    </div>

    <div id="trade" class="page active" style="overflow: hidden;">
        <div id="tradingview_widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
        new TradingView.widget(
        {
          "autosize": true,
          "symbol": "BINANCE:BTCUSDT",
          "interval": "60",
          "timezone": "Etc/UTC",
          "theme": "dark",
          "style": "1",
          "locale": "ru",
          "toolbar_bg": "#0b0b0b",
          "enable_publishing": false,
          "hide_top_toolbar": true, // Прячем лишние кнопки
          "hide_legend": true, // Скрываем легенду
          "save_image": false,
          "container_id": "tradingview_widget",
          "backgroundColor": "#0b0b0b", // HL Style
          "gridColor": "#141414",
          "studies": []
        }
        );
        </script>
        <div class="trade-controls">
            <button class="hl-btn" onclick="tg.showAlert('Покупка LONG: Не подключено API Bybit')">BUY / LONG</button>
            <button class="hl-btn" style="background: var(--red);" onclick="tg.showAlert('Продажа SHORT: Не подключено API Bybit')">SELL / SHORT</button>
        </div>
    </div>

    <div id="portfolio" class="page">
        <div class="stat-label">TOTAL EQUITY</div>
        <div class="stat-value" id="balance-usdt">$0.00</div>
        
        <div class="stat-label">ACTIVE POSITIONS</div>
        <div class="portfolio-card" style="text-align: center; color: var(--text-dim);">
            No active positions
        </div>
    </div>

    <div id="ai" class="page">
        <div class="stat-label">AI AGENT STATUS</div>
        <div style="color: var(--accent); margin-bottom: 20px; padding: 0 16px;">● ONLINE</div>
        <p style="padding: 0 16px;">Получите анализ рынка на основе алгоритмов Hyperliquid.</p>
        <div style="padding: 16px;">
            <button class="hl-btn hl-btn-outline" onclick="tg.sendData('get_ai_signal')">GENERATE PREDICTION</button>
        </div>
    </div>

    <div id="settings" class="page">
        <div class="stat-label">ACCOUNT SETTINGS</div>
        <div class="portfolio-card">
            <p>API Bybit: Connected</p>
            <p>Language: English</p>
            <p>Theme: Hyperdark</p>
        </div>
        <div style="padding: 16px;">
            <button class="hl-btn hl-btn-outline" onclick="tg.close()">LOGOUT</button>
        </div>
    </div>

    <nav class="nav">
        <div class="nav-item active" onclick="switchTab('trade', this)"><div>📈</div>TRADE</div>
        <div class="nav-item" onclick="switchTab('portfolio', this)"><div>💼</div>PORTFOLIO</div>
        <div class="nav-item" onclick="switchTab('ai', this)"><div>🤖</div>AI</div>
        <div class="nav-item" onclick="switchTab('settings', this)"><div>⚙️</div>SETTINGS</div>
    </nav>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#0b0b0b';

        // Переключение вкладок
        function switchTab(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        // Подключение TON Wallet
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp-with-react/master/public/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });
    </script>
</body>
</html>
