<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main-color: #00ff00; --bg-color: #050505; --card-bg: #121212; --text-gray: #888; }
        body { background-color: var(--bg-color); color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding-bottom: 80px; overflow-x: hidden; }
        
        .header { padding: 15px; position: sticky; top: 0; background: var(--bg-color); border-bottom: 1px solid #222; z-index: 10; }
        .search-box { background: #1a1a1a; border: none; color: white; padding: 10px; width: 90%; border-radius: 8px; margin-top: 10px; }

        /* Список пар */
        .market-list { padding: 10px; }
        .crypto-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 15px; background: var(--card-bg); margin-bottom: 5px; 
            border-radius: 10px; transition: 0.2s;
        }
        .crypto-info { display: flex; flex-direction: column; }
        .symbol { font-weight: bold; font-size: 16px; }
        .vol { font-size: 11px; color: var(--text-gray); }
        .price-info { text-align: right; }
        .price { font-family: monospace; font-size: 16px; transition: color 0.3s; }
        
        /* Цветовая индикация изменения цены */
        .up { color: #00ff00; }
        .down { color: #ff4444; }

        /* Навигация */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #0f0f0f; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
        .nav-item { color: var(--text-gray); font-size: 12px; cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--main-color); }
    </style>
</head>
<body>

<div class="header">
    <div style="color: var(--main-color); font-weight: bold; letter-spacing: 1px;">VERTEX TERMINAL</div>
    <input type="text" class="search-box" placeholder="Поиск монет (например, BTC)..." oninput="filterCoins(this.value)">
</div>

<div id="market" class="market-list">
    </div>

<nav class="nav-bar">
    <div class="nav-item active">📊 Рынок</div>
    <div class="nav-item" onclick="tg.showAlert('Раздел в разработке')">🔄 Торги</div>
    <div class="nav-item" onclick="tg.showAlert('Требуется подписка')">🤖 ИИ</div>
</nav>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let coinsData = {}; // Объект для хранения цен
    let symbols = []; // Список 100 символов

    // 1. Получаем ТОП-100 пар по объему через REST API в начале
    async function initMarket() {
        try {
            const response = await fetch('https://api.binance.com/api/v3/ticker/24hr');
            const data = await response.json();
            
            // Фильтруем только пары к USDT и сортируем по объему (quoteVolume)
            const top100 = data
                .filter(i => i.symbol.endsWith('USDT'))
                .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
                .slice(0, 100);

            symbols = top100.map(i => i.symbol.toLowerCase());
            
            // Отрисовываем каркас
            const container = document.getElementById('market');
            container.innerHTML = top100.map(coin => `
                <div class="crypto-row" id="row-${coin.symbol}">
                    <div class="crypto-info">
                        <span class="symbol">${coin.symbol.replace('USDT', '')} <small style="color:#555">/USDT</small></span>
                        <span class="vol">Vol: ${Math.round(coin.quoteVolume / 1000000)}M</span>
                    </div>
                    <div class="price-info">
                        <div class="price" id="price-${coin.symbol}">$${parseFloat(coin.lastPrice).toFixed(2)}</div>
                    </div>
                </div>
            `).join('');

            startWebSocket();
        } catch (e) {
            console.error("Ошибка инициализации рынка:", e);
        }
    }

    // 2. Подключаем WebSocket для живого обновления цен
    function startWebSocket() {
        // Создаем поток для всех 100 пар сразу
        const streamNames = symbols.map(s => `${s}@ticker`).join('/');
        const socket = new WebSocket(`wss://stream.binance.com:9443/ws/${streamNames}`);

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const symbol = data.s;
            const price = parseFloat(data.c).toFixed(symbol.includes('SHIB') ? 6 : 2);
            const priceChange = parseFloat(data.p);
            
            const priceEl = document.getElementById(`price-${symbol}`);
            if (priceEl) {
                // Эффект вспышки при изменении
                const oldPrice = parseFloat(priceEl.innerText.replace('$', ''));
                priceEl.innerText = `$${price}`;
                
                if (parseFloat(price) > oldPrice) {
                    priceEl.className = 'price up';
                } else if (parseFloat(price) < oldPrice) {
                    priceEl.className = 'price down';
                }
            }
        };
    }

    // Поиск по списку
    function filterCoins(query) {
        const rows = document.querySelectorAll('.crypto-row');
        rows.forEach(row => {
            const symbol = row.id.replace('row-', '');
            row.style.display = symbol.includes(query.toUpperCase()) ? 'flex' : 'none';
        });
    }

    initMarket();
</script>
</body>
</html>
