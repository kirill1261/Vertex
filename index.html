<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #000; color: #00ff00; font-family: monospace; text-align: center; }
        .card { border: 1px solid #00ff00; padding: 20px; margin: 10px; border-radius: 10px; }
        button { background: #00ff00; color: #000; border: none; padding: 15px; width: 80%; font-weight: bold; border-radius: 5px; }
        .price { font-size: 24px; color: #fff; }
    </style>
</head>
<body>
    <h1>VERTEX TERMINAL</h1>
    <div class="card">
        <p>BTC/USDT</p>
        <div class="price" id="btc-price">Загрузка...</div>
    </div>
    <button onclick="sendSignal()">ПОЛУЧИТЬ ИИ-ПРОГНОЗ</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        function sendSignal() {
            tg.sendData("get_ai_signal"); // Отправляет команду боту
            tg.close();
        }
    </script>
</body>
</html>
