<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808; --card: #141414; --brd: #222;
            --acc: #00ffa3; --txt: #ffffff; --dim: #a0a0a0; --red: #ff3b69;
        }
        body {
            background: var(--bg); color: var(--txt);
            font-family: 'Roboto Mono', monospace; margin: 0; padding: 0;
            font-size: 16px; overflow-x: hidden;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 16px; border-bottom: 1px solid var(--brd); background: var(--bg);
        }
        
        .asset-select { 
            background: var(--card); border: 1px solid var(--acc); 
            color: var(--acc); padding: 8px 12px; border-radius: 6px; 
            font-size: 16px; font-weight: bold; outline: none;
        }

        /* Панель таймфреймов */
        .tf-bar {
            display: flex; background: #000; border-bottom: 1px solid var(--brd);
            overflow-x: auto; padding: 5px; gap: 5px; scrollbar-width: none;
        }
        .tf-bar::-webkit-scrollbar { display: none; }
        .tf-btn {
            padding: 6px 12px; background: transparent; border: 1px solid transparent;
            color: var(--dim); border-radius: 4px; font-size: 12px; cursor: pointer;
            white-space: nowrap; font-weight: bold;
        }
        .tf-btn.active { color: var(--acc); border-color: var(--acc); background: rgba(0, 255, 163, 0.1); }

        #tv_chart { width: 100%; height: 380px; border-bottom: 1px solid var(--brd); }

        /* Форма ордера */
        .order-box { padding: 15px 16px; background: var(--card); border-bottom: 1px solid var(--brd); }
        .input-wrapper { margin-bottom: 15px; position: relative; }
        .input-wrapper label { display: block; color: var(--dim); font-size: 11px; margin-bottom: 5px; text-transform: uppercase; }
        
        .hl-input {
            width: 100%; background: #000; border: 1px solid var(--brd);
            color: var(--acc); padding: 12px; border-radius: 6px; font-size: 18px;
            box-sizing: border-box; font-family: inherit; font-weight: bold;
        }
        .input-unit { position: absolute; right: 12px; top: 32px; color: var(--dim); font-size: 13px; }
        .calc-info { font-size: 12px; color: var(--acc); margin-top: 4px; font-weight: bold; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px 16px; }
        .hl-btn { 
            padding: 18px; border: none; font-weight: 900; border-radius: 6px;
            font-size: 16px; cursor: pointer; text-transform: uppercase;
        }
        .hl-btn:active { transform: scale(0.97); }

        .pos-header { padding: 8px 16px; color: var(--dim); font-size: 11px; letter-spacing: 1px; }
        .position-card {
            margin: 0 16px 15px 16px; padding: 15px; background: #111; 
            border-left: 4px solid var(--acc); border-radius: 6px;
        }
        .pnl-row { display: flex; justify-content: space-between; align-items: center; }
        .pnl-val { font-size: 20px; font-weight: bold; color: var(--acc); }

        #ton-connect button { background-color: var(--acc) !important; height: 36px !important; }
    </style>
</head>
<body>

    <div class="header">
        <select class="asset-select" id="asset-picker" onchange="updateSymbol(this.value)">
            <option value="BTCUSDT">BTC/USDT</option>
            <option value="ETHUSDT">ETH/USDT</option>
            <option value="TONUSDT">TON/USDT</option>
        </select>
        <div id="ton-connect"></div>
    </div>

    <div class="tf-bar" id="tf-bar">
        <button class="tf-btn" onclick="changeTF('5', this)">5m</button>
        <button class="tf-btn" onclick="changeTF('15', this)">15m</button>
        <button class="tf-btn" onclick="changeTF('30', this)">30m</button>
        <button class="tf-btn active" onclick="changeTF('60', this)">1h</button>
        <button class="tf-btn" onclick="changeTF('120', this)">2h</button>
        <button class="tf-btn" onclick="changeTF('240', this)">4h</button>
        <button class="tf-btn" onclick="changeTF('D', this)">1D</button>
    </div>

    <div id="trade-page">
        <div id="tv_chart"></div>
        
        <div class="order-box">
            <div class="input-wrapper">
                <label>Limit Price</label>
                <input type="number" class="hl-input" id="price-in" placeholder="0.00" oninput="calculateTotal()">
                <span class="input-unit">USDT</span>
            </div>
            
            <div class="input-wrapper">
                <label>Amount (Size)</label>
                <input type="number" class="hl-input" id="amount-in" placeholder="0.00" oninput="calculateTotal()">
                <span class="input-unit" id="unit-label">BTC</span>
                <div class="calc-info" id="total-usdt">Total: 0.00 USDT</div>
            </div>
        </div>

        <div class="btn-group">
            <button class="hl-btn" style="background:var(--acc); color: #000;" onclick="openOrder('LONG')">LONG</button>
            <button class="hl-btn" style="background:var(--red); color: #fff;" onclick="openOrder('SHORT')">SHORT</button>
        </div>

        <div class="pos-header">ACTIVE POSITIONS</div>
        <div id="pos-container"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#080808';

        let currentSymbol = "BTCUSDT";
        let currentInterval = "60";

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://ton-connect.github.io/demo-dapp-with-react/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        function renderChart(symbol, interval) {
            new TradingView.widget({
                "autosize": true, "symbol": "BINANCE:" + symbol,
                "interval": interval, "theme": "dark", "style": "1",
                "container_id": "tv_chart", "hide_top_toolbar": true,
                "backgroundColor": "#080808", "gridColor": "#151515",
                "hide_legend": true, "save_image": false
            });
        }

        function changeTF(tf, el) {
            currentInterval = tf;
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            renderChart(currentSymbol, tf);
            tg.HapticFeedback.selectionChanged();
        }

        function updateSymbol(val) {
            currentSymbol = val;
            document.getElementById('unit-label').innerText = val.replace('USDT', '');
            renderChart(val, currentInterval);
            calculateTotal();
        }

        function calculateTotal() {
            const price = document.getElementById('price-in').value || 0;
            const amount = document.getElementById('amount-in').value || 0;
            document.getElementById('total-usdt').innerText = `Total: ${(price * amount).toFixed(2)} USDT`;
        }

        function openOrder(side) {
            const price = document.getElementById('price-in').value;
            const amount = document.getElementById('amount-in').value;
            if(!price || !amount) return tg.showAlert("Заполните поля!");

            const asset = currentSymbol.replace('USDT', '');
            const html = `
                <div class="position-card" style="border-left-color: ${side === 'LONG' ? 'var(--acc)' : 'var(--red)'}">
                    <div class="pnl-row">
                        <span style="font-weight:bold">${side} ${amount} ${asset}</span>
                        <span class="pnl-val" style="color: ${side === 'LONG' ? 'var(--acc)' : 'var(--red)'}">+$${(Math.random()*10).toFixed(2)}</span>
                    </div>
                    <div style="font-size:12px; color:var(--dim); margin-top:4px">Value: ${(price * amount).toFixed(2)} USDT • Entry: ${price}</div>
                </div>
            `;
            document.getElementById('pos-container').innerHTML = html;
            tg.HapticFeedback.notificationOccurred('success');
        }

        renderChart('BTCUSDT', '60');
    </script>
</body>
</html>
