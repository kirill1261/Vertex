<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0b0b; --card: #141414; --brd: #262626;
            --acc: #00ffa3; --txt: #e5e5e5; --dim: #808080; --red: #ff3b69;
        }
        body.light {
            --bg: #ffffff; --card: #f5f5f5; --brd: #e0e0e0;
            --acc: #00a36c; --txt: #1a1a1a; --dim: #666666;
        }
        body {
            background: var(--bg); color: var(--txt);
            font-family: 'Roboto Mono', monospace; margin: 0; padding: 0;
            font-size: 12px; overflow: hidden; transition: 0.3s;
        }

        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; border-bottom: 1px solid var(--brd); background: var(--bg);
        }
        .asset-select { 
            background: var(--card); border: 1px solid var(--brd); 
            color: var(--acc); padding: 4px 8px; border-radius: 4px; font-weight: bold;
        }

        /* Layout */
        .page { display: none; height: calc(100vh - 100px); overflow-y: auto; }
        .page.active { display: block; }

        /* Trade Section */
        #tv_chart { width: 100%; height: 45vh; border-bottom: 1px solid var(--brd); }
        .orderbook { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--brd); }
        .ob-side { background: var(--bg); padding: 8px; }
        .ob-row { display: flex; justify-content: space-between; margin-bottom: 3px; font-size: 10px; }

        /* Buttons */
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
        .hl-btn { 
            padding: 12px; border: none; font-weight: bold; border-radius: 2px;
            font-family: inherit; cursor: pointer;
        }

        /* Nav */
        .nav {
            position: fixed; bottom: 0; width: 100%; display: flex;
            justify-content: space-around; padding: 12px 0;
            border-top: 1px solid var(--brd); background: var(--bg);
        }
        .nav-item { color: var(--dim); font-size: 10px; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--acc); }

        /* Settings */
        .s-row { 
            display: flex; justify-content: space-between; padding: 15px; 
            border-bottom: 1px solid var(--brd); background: var(--card); margin: 8px;
        }
    </style>
</head>
<body class="dark">

    <div class="header">
        <select class="asset-select" onchange="changeAsset(this.value)">
            <option value="BTCUSDT">BTC/USDT</option>
            <option value="ETHUSDT">ETH/USDT</option>
            <option value="SOLUSDT">SOL/USDT</option>
            <option value="TONUSDT">TON/USDT</option>
        </select>
        <div id="ton-connect"></div>
    </div>

    <div id="trade" class="page active">
        <div id="tv_chart"></div>
        
        <div class="orderbook">
            <div class="ob-side">
                <div style="color:var(--red); margin-bottom:5px">SELL ORDERS</div>
                <div id="asks"></div>
            </div>
            <div class="ob-side">
                <div style="color:var(--acc); margin-bottom:5px">BUY ORDERS</div>
                <div id="bids"></div>
            </div>
        </div>

        <div class="btn-group">
            <button class="hl-btn" style="background:var(--acc)" onclick="trade('BUY')">LONG</button>
            <button class="hl-btn" style="background:var(--red); color:white" onclick="trade('SELL')">SHORT</button>
        </div>
    </div>

    <div id="portfolio" class="page">
        <div style="padding:20px; text-align:center">
            <div style="color:var(--dim)">ESTIMATED BALANCE</div>
            <div style="font-size:24px; font-weight:bold; margin:10px 0">$1,240.55</div>
            <div style="color:var(--acc)">+2.45% (24h)</div>
        </div>
        <div class="s-row"><span>Margin Usage</span><span>0%</span></div>
        <div class="s-row"><span>Available</span><span>$1,240.55</span></div>
    </div>

    <div id="settings" class="page">
        <div class="s-row">
            <span>Theme: Dark Mode</span>
            <input type="checkbox" checked onchange="toggleTheme()">
        </div>
        <div class="s-row" onclick="window.open('https://t.me/your_support')">
            <span>Support Chat</span><span>→</span>
        </div>
        <div class="s-row" onclick="tg.close()"><span>Exit Terminal</span></div>
    </div>

    <nav class="nav">
        <div class="nav-item active" onclick="tab('trade', this)">📈 TRADE</div>
        <div class="nav-item" onclick="tab('portfolio', this)">💼 PORTFOLIO</div>
        <div class="nav-item" onclick="tab('settings', this)">⚙️ SETTINGS</div>
    </nav>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let currentSymbol = "BTCUSDT";

        function tab(id, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        function renderChart(symbol, theme) {
            new TradingView.widget({
                "autosize": true, "symbol": "BINANCE:" + symbol,
                "interval": "60", "theme": theme, "style": "1",
                "container_id": "tv_chart", "hide_top_toolbar": true,
                "backgroundColor": theme === 'dark' ? "#0b0b0b" : "#ffffff"
            });
        }

        function changeAsset(val) {
            currentSymbol = val;
            const theme = document.body.classList.contains('light') ? 'light' : 'dark';
            renderChart(val, theme);
            tg.HapticFeedback.impactOccurred('medium');
        }

        function toggleTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            renderChart(currentSymbol, isLight ? 'light' : 'dark');
            tg.setHeaderColor(isLight ? '#ffffff' : '#0b0b0b');
        }

        // Имитация стакана (динамика)
        function updateOrderbook() {
            const generateRows = (color) => {
                let html = '';
                for(let i=0; i<5; i++) {
                    html += `<div class="ob-row"><span style="color:${color}">${(Math.random()*100 + 60000).toFixed(1)}</span><span>${(Math.random()).toFixed(3)}</span></div>`;
                }
                return html;
            }
            document.getElementById('asks').innerHTML = generateRows('var(--red)');
            document.getElementById('bids').innerHTML = generateRows('var(--acc)');
        }

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp-with-react/master/public/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        function trade(side) {
            tg.showConfirm(`Confirm ${side} order for ${currentSymbol}?`);
        }

        renderChart('BTCUSDT', 'dark');
        setInterval(updateOrderbook, 1000);
    </script>
</body>
</html>
