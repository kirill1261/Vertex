<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #080808; --card: #121212; --brd: #222; --acc: #00ffa3; --txt: #fff; --dim: #808080; --red: #ff3b69; }
        body { background: var(--bg); color: var(--txt); font-family: 'Roboto Mono', monospace; margin: 0; padding: 0; font-size: 14px; overflow: hidden; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid var(--brd); height: 60px; box-sizing: border-box; }
        #active-pair-name { font-weight: bold; color: var(--acc); font-size: 16px; }

        /* Pages */
        .page { display: none; height: calc(100vh - 130px); overflow-y: auto; }
        .page.active { display: block; }

        /* Market Table */
        .m-table { width: 100%; border-collapse: collapse; }
        .m-table tr { border-bottom: 1px solid #151515; cursor: pointer; transition: 0.2s; }
        .m-table td { padding: 15px; }
        .price-up { color: var(--acc); }
        .price-down { color: var(--red); }

        /* Trade Form */
        #tv_chart { width: 100%; height: 280px; border-bottom: 1px solid var(--brd); }
        .order-area { padding: 15px; background: var(--card); }
        .input-box { width: 100%; background: #000; border: 1px solid var(--brd); color: var(--acc); padding: 12px; border-radius: 4px; margin-bottom: 10px; font-family: inherit; box-sizing: border-box; }
        .trade-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .t-btn { padding: 15px; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; }

        /* Wallet Card */
        .wallet-hero { padding: 35px 20px; text-align: center; background: var(--card); margin: 15px; border-radius: 12px; border: 1px solid var(--brd); }
        .balance-val { font-size: 32px; font-weight: bold; margin: 10px 0; color: var(--txt); }

        /* Navigation */
        .nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--brd); background: var(--bg); z-index: 1000; }
        .nav-item { color: var(--dim); font-size: 10px; text-align: center; cursor: pointer; font-weight: bold; }
        .nav-item.active { color: var(--acc); }

        #ton-connect button { background-color: var(--acc) !important; color: #000 !important; }
    </style>
</head>
<body>

    <div class="header">
        <div id="active-pair-name">BTC/USDT</div>
        <div id="ton-connect"></div>
    </div>

    <div id="page-home" class="page active">
        <div style="padding:15px; color:var(--dim); font-size:11px;">LIVE MARKET DATA</div>
        <table class="m-table" id="coin-list"></table>
    </div>

    <div id="page-trade" class="page">
        <div id="tv_chart"></div>
        <div class="order-area">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:11px">
                <span style="color:var(--dim)">Available:</span>
                <span class="sync-balance" style="color:var(--acc)">0.00 USDT</span>
            </div>
            <input type="number" class="input-box" id="trade-price" placeholder="Price">
            <input type="number" class="input-box" id="trade-qty" placeholder="Amount">
            <div class="trade-btns">
                <button class="t-btn" style="background:var(--acc); color:#000" onclick="tg.showAlert('Long Order Placed')">Long</button>
                <button class="t-btn" style="background:var(--red); color:#fff" onclick="tg.showAlert('Short Order Placed')">Short</button>
            </div>
        </div>
    </div>

    <div id="page-wallet" class="page">
        <div class="wallet-hero">
            <div style="color:var(--dim); font-size:12px">TOTAL EQUITY</div>
            <div class="balance-val sync-balance">$0.00</div>
            <div id="wallet-addr" style="font-size:10px; color:var(--dim)">Not connected</div>
        </div>
        <div style="padding:15px; font-size:12px; color:var(--dim)">MY ASSETS</div>
        <div style="padding:0 20px">
            <div style="display:flex; justify-content:space-between; padding:15px 0; border-bottom:1px solid #151515">
                <span>USDT</span><b class="sync-balance">$0.00</b>
            </div>
        </div>
    </div>

    <nav class="nav">
        <div class="nav-item active" onclick="navTo('page-home', this)">🏠<br>Markets</div>
        <div class="nav-item" onclick="navTo('page-trade', this)">📈<br>Trade</div>
        <div class="nav-item" onclick="navTo('page-wallet', this)">💼<br>Wallet</div>
    </nav>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        let currentSymbol = "BTCUSDT";
        let globalBalance = 0.00;

        // --- TON CONNECT LOGIC ---
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://ton-connect.github.io/demo-dapp-with-react/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                globalBalance = 1420.50; // Имитация баланса из кошелька
                document.getElementById('wallet-addr').innerText = wallet.account.address.slice(0,10) + "...";
            } else {
                globalBalance = 0.00;
                document.getElementById('wallet-addr').innerText = "Not connected";
            }
            updateAllBalances();
        });

        function updateAllBalances() {
            document.querySelectorAll('.sync-balance').forEach(el => {
                el.innerText = globalBalance > 0 ? `$${globalBalance.toFixed(2)}` : "0.00 USDT";
            });
        }

        // --- NAVIGATION ---
        function navTo(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            el.classList.add('active');
            if(pageId === 'page-trade') loadTradingView(currentSymbol);
        }

        // --- MARKET & WEBSOCKET ---
        const coins = ["BTC", "ETH", "SOL", "TON", "NOT", "XRP", "DOGE"];
        
        function initMarkets() {
            const container = document.getElementById('coin-list');
            coins.forEach(c => {
                const tr = document.createElement('tr');
                tr.id = `pair-${c}`;
                tr.onclick = () => {
                    currentSymbol = c + "USDT";
                    document.getElementById('active-pair-name').innerText = c + "/USDT";
                    navTo('page-trade', document.querySelectorAll('.nav-item')[1]);
                };
                tr.innerHTML = `<td><b>${c}</b>/USDT</td><td class="price" style="text-align:right">---</td><td class="pct" style="text-align:right">0%</td>`;
                container.appendChild(tr);
            });

            // WebSocket Binance
            const streams = coins.map(c => c.toLowerCase() + 'usdt@ticker').join('/');
            const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${streams}`);
            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                const s = d.s.replace('USDT','');
                const row = document.getElementById(`pair-${s}`);
                if(row) {
                    const price = parseFloat(d.c).toFixed(2);
                    const pct = parseFloat(d.P).toFixed(2);
                    row.querySelector('.price').innerText = `$${price}`;
                    const pEl = row.querySelector('.pct');
                    pEl.innerText = `${pct}%`;
                    pEl.className = `pct ${pct >= 0 ? 'price-up' : 'price-down'}`;
                }
            };
        }

        // --- CHART ---
        function loadTradingView(s) {
            new TradingView.widget({
                "autosize": true, "symbol": "BINANCE:" + s, "interval": "60", "theme": "dark",
                "container_id": "tv_chart", "hide_top_toolbar": true, "backgroundColor": "#080808"
            });
        }

        initMarkets();
        updateAllBalances();
    </script>
</body>
</html>
